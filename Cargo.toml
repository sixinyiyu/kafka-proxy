[package]
name = "kafka-demo"
version = "0.1.0"
edition = "2024"
publish = ["artifactory"]

[dependencies]
simple-log = "2.3.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
serde_trim = "1.1.0"
ctrlc = "3.5.2"
tokio = { version = "1.50.0", features = ["full"] }
rdkafka = { version = "0.38.0", features = ["ssl", "sasl"] }
