[package]
name = "kafka-proxy"
version = "0.1.0"
edition = "2024"
publish = ["artifactory"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
kafka_client = "0.8"

bytes = "1.12.1"
toml = "0.9.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2.0.19"
dashmap = "6"
clap = { version = "4.6.5", features = ["derive"] }
axum = "0.8"


[lib]
name = "kafka_proxy"
path = "src/lib.rs"

[[bin]]
name = "kafka-proxy"
path = "src/main.rs"
