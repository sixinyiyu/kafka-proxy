# 构建 x86_64 / aarch64 可执行安装包的流水线。
#
#
# 策略：
#   - lint(fmt/clippy/check/test) 在原生 runner 上快速跑。
#   - release 构建在 CentOS 7 容器内编译(glibc 2.17)，保证产出的二进制
#     在 CentOS 7 / RHEL 7+ / Ubuntu 18+ 等老系统上也能运行(避免 GLIBC_2.38 not found)。
#     krb5-gss / rustls 均为纯 Rust 无 C FFI，无需容器内安装系统库。
#   - x86_64 用 ubuntu-latest + centos:7 容器；
#     aarch64 用 ubuntu-24.04-arm + centos:7 容器。
#
# 触发：推送 tag (v*) → 构建 + 发布 release；PR/推送 main → 仅 lint + 构建校验。

name: Build (x86 + ARM)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain + components
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check + test
        run: |
          cargo check --all-targets
          cargo test --lib

  build:
    name: Build ${{ matrix.arch }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS 7 container (glibc 2.17 for max compat)
        uses: docker://centos:7
        with:
          args: >
            bash -c "
            yum install -y curl gcc make &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 &&
            source $HOME/.cargo/env &&
            rustup component add rustfmt clippy &&
            cargo build --release &&
            mkdir -p /workspace/pkg &&
            cp target/release/kafka-proxy /workspace/pkg/ &&
            cp kafka-proxy.toml.example /workspace/pkg/ &&
            cp README.md /workspace/pkg/ &&
            cp install.sh /workspace/pkg/
            "

      - name: Package install bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="dev-$(echo "$GITHUB_SHA" | cut -c1-8)"
          fi
          PKG="kafka-proxy-${VERSION}-${{ matrix.arch }}"
          mkdir -p "$PKG"
          # 从容器输出目录拷贝产物
          cp /workspace/pkg/kafka-proxy "$PKG/" || cp target/release/kafka-proxy "$PKG/"
          cp kafka-proxy.toml.example "$PKG/"
          cp README.md "$PKG/"
          cp install.sh "$PKG/"
          chmod +x "$PKG/install.sh"
          cat > "$PKG/VERSION.txt" <<EOF
          kafka-proxy ${VERSION}
          arch: ${{ matrix.arch }}
          build: ${GITHUB_SHA}
          rust: $(rustc --version 2>/dev/null || echo "1.97.1")
          glibc_target: 2.17 (CentOS 7 compat)
          EOF
          tar czf "${PKG}.tar.gz" "$PKG"
          echo "PKG_NAME=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafka-proxy-${{ matrix.arch }}
          path: ${{ env.PKG_NAME }}
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
