# 构建 x86_64 / aarch64 静态可执行安装包的流水线。
#
#
# 策略：
#   - lint(fmt/clippy/check/test) 在 ubuntu-latest 原生 runner 上快速跑。
#   - release 构建采用 musl 静态链接，产出完全静态二进制（不依赖任何 glibc），
#     可在 CentOS 7 / RHEL 7+ / Ubuntu 18+ 等任意 Linux 新老系统上运行。
#     参考 kafka_client 的 CI 做法：ubuntu runner + musl-tools + cmake/perl。
#   - x86_64 用 ubuntu-latest 原生 runner；
#     aarch64 用 ubuntu-24.04-arm 原生 runner。
#     两架构均在原生 runner 上编译（无需交叉工具链，musl-tools 即提供对应 musl-gcc）。
#   - 注意：依赖 zstd-sys / aws-lc-sys 含 C 代码，故需 musl C 工具链 + cmake/perl
#     （aws-lc 构建系统依赖 cmake/perl；zstd-sys 依赖 musl-gcc）。
#
# 触发：推送 tag (v*) → 构建 + 发布 release；PR/推送 main → 仅 lint + 构建校验。

name: Build (x86 + ARM)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain + components
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check + test
        run: |
          cargo check --all-targets
          cargo test --lib

  build:
    name: Build ${{ matrix.arch }} (musl static)
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      # musl-tools 提供 musl-gcc；cmake/perl 是 aws-lc-sys 构建系统所需；
      # perl 亦是部分 C 库构建脚本依赖。
      - name: Install musl toolchain + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake perl

      - name: Install Rust toolchain
        run: |
          rustup default 1.97.1
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.arch }}

      - name: cargo build --release (musl static)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify static binary
        run: |
          BIN="target/${{ matrix.target }}/release/kafka-proxy"
          echo "=== file ==="
          file "$BIN"
          echo "=== ldd (应报 not a dynamic executable) ==="
          ldd "$BIN" || true

      - name: Package install bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="dev-$(echo "$GITHUB_SHA" | cut -c1-8)"
          fi
          PKG="kafka-proxy-${VERSION}-${{ matrix.arch }}"
          mkdir -p "$PKG"
          cp "target/${{ matrix.target }}/release/kafka-proxy" "$PKG/"
          cp kafka-proxy.toml.example "$PKG/"
          cp README.md "$PKG/"
          cp install.sh "$PKG/"
          chmod +x "$PKG/install.sh"
          cat > "$PKG/VERSION.txt" <<EOF
          kafka-proxy ${VERSION}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }} (static, musl libc)
          build: ${GITHUB_SHA}
          rust: $(rustc --version)
          linking: fully static (no glibc dependency)
          EOF
          tar czf "${PKG}.tar.gz" "$PKG"
          echo "PKG_NAME=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafka-proxy-${{ matrix.arch }}
          path: ${{ env.PKG_NAME }}
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
